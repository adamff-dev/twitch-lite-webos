<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Light Twitch</title>
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<div id="app">
  <div id="top">
    <span class="f tab" data-tab="streams">Inicio</span>
    <span class="f tab" data-tab="games">Categorías</span>
    <span class="f tab" data-tab="following">Siguiendo</span>
    <span class="f tab" data-tab="videos">Vídeos</span>
    <input class="f tab" id="q" data-tab="search" type="text" placeholder="Buscar canal…" autocomplete="off">
    <span id="crumb"></span>
    <span class="f tab" id="acct" data-tab="account">Entrar</span>
  </div>
  <div id="content">
    <div id="grid"></div>
    <div id="msg"></div>
  </div>
</div>
<div id="player" hidden>
  <video id="v" autoplay></video>
  <div id="pmsg" hidden></div>
  <div id="pstate" hidden></div>
  <div id="ptoast" hidden></div>
  <div id="chat" hidden><div id="cst"></div><div id="cmsgs"></div></div>
  <div id="ovl" hidden>
    <div id="oname"></div>
    <div id="oinfo"></div>
    <div id="obar"><div id="ofill"></div></div>
    <div id="otime"></div>
    <div id="ohint">OK: calidad · Play/Pause · Atrás: salir</div>
  </div>
  <div id="qmenu" hidden></div>
</div>
<div id="atoast" hidden></div>
<div id="login" hidden>
  <div id="lbox">
    <div id="lqr"></div>
    <div id="lside">
      <div id="lt">Cuenta de Twitch</div>
      <div id="lc"></div>
      <div id="ls"></div>
      <div id="lh"></div>
    </div>
  </div>
</div>
<script src="js/config.js"></script>
<script src="js/api.js"></script>
<script src="js/auth.js"></script>
<script src="js/qr.js"></script>
<script src="js/points.js"></script>
<script src="js/chat.js"></script>
<script src="js/player.js"></script>
<script src="js/login.js"></script>
<script src="js/app.js"></script>
</body>
</html>
