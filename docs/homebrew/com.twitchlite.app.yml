# Borrador del archivo para https://github.com/webosbrew/apps-repo  ->  packages/com.twitchlite.app.yml
# (ver docs/homebrew/README.md antes de enviarlo)
title: Twitch Lite
iconUri: https://raw.githubusercontent.com/adamff-dev/twitch-lite-webos/master/docs/icon.png
manifestUrl: https://github.com/adamff-dev/twitch-lite-webos/releases/latest/download/com.twitchlite.app.manifest.json
category: internet
pool: main
requirements:
  webosRelease: '>=6.0'
screenshots:
  - url: https://raw.githubusercontent.com/adamff-dev/twitch-lite-webos/master/docs/screenshot-home.png
    caption: Home
description: |
  An unofficial, lightweight Twitch client built for modest TVs: native HLS playback, no frameworks.

  - Home, Categories, Following, Videos and Search, with number keys for each tab
  - Sign in with your own Twitch account by QR code
  - Read-only chat for live streams, and a synchronized chat replay on past broadcasts, with Twitch, 7TV, BTTV and FFZ emotes (small static images, bounded memory); the Red button shows or hides it
  - Live alerts: while you watch, a small message with the channel's picture (and a short beep, optional) when another channel you follow goes live; click it or press Yellow to switch to it
  - Ad blocking on live streams (on by default, can be turned off; it relies on how Twitch serves ads today)
  - VODs resume where you left them
  - Content in your TV language; choosing a tab again reloads it
  - Configurable chat (size, width, height, corner, opacity), and a scrollable settings screen
  - English and Spanish interface
  - Tries to restore the audio of VOD segments muted by Twitch and to play subscriber-only VODs from public CDN files. Both rely on how Twitch serves videos today and may stop working at any time; the first one can be turned off in Settings

  Source: https://github.com/adamff-dev/twitch-lite-webos

  Not made by, endorsed by or affiliated with Twitch Interactive, Inc.
