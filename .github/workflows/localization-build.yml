name: Build localized Twitch Lite

on:
  push:
    branches:
      - feature/json-localization-de
  workflow_dispatch:

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run tests
        run: npm test
      - name: Install webOS CLI
        run: npm install --global @webos-tools/cli
      - name: Build IPK
        run: npm run package
      - name: Upload IPK
        uses: actions/upload-artifact@v4
        with:
          name: twitch-lite-localized-ipk
          path: out/*.ipk
          if-no-files-found: error
